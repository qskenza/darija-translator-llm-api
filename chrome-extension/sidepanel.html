<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darija Translator</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="container">
    <h2>Darija Translator</h2>

    <label>API Base URL</label>
    <input id="baseUrl" value="http://localhost:8080" />

    <label>Username</label>
    <input id="username" value="admin" />

    <label>Password</label>
    <input id="password" type="password" value="admin123" />

    <label>Selected Text</label>
    <textarea id="sourceText" rows="6"></textarea>

    <button id="translateBtn">Translate</button>

    <label>Darija Translation</label>
    <textarea id="resultText" rows="6" readonly></textarea>

    <p id="status"></p>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
